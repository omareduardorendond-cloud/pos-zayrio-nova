<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS Gorras & Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <!-- Logotipo oficial -->
            <img src="{{ url_for('static', filename='zayrio_nova.jpg') }}" alt="Logo Zayrio Nova" width="100" class="mb-3 rounded-circle shadow" style="object-fit: cover; height: 100px;">
            <h3 class="fw-bold text-dark">CAPS & CLOTHING</h3>
            <p class="text-muted small">Inicia sesión para gestionar el sistema</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario apuntando correctamente a la ruta principal -->
        <form action="/" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ej: 772296 Omar7722" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
        </form>

        <div class="text-center mt-3">
            <a href="/registro" class="text-decoration-none small">¿Nuevo usuario? Regístrate aquí</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
